services:
  frontend:
    build:
      context: ./frontend
    container_name: mercantis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - mercantis-network

  backend:
    build:
      context: ./backend
    container_name: mercantis-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?Defina DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Defina DB_NAME}
      DB_USER: ${DB_USER:?Defina DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    expose:
      - "8000"
    networks:
      - mercantis-network

networks:
  mercantis-network:
    driver: bridge
